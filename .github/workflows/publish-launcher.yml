name: Publish verified Celesphonia launcher

on:
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout preverified release assets
        uses: actions/checkout@v4
        with:
          ref: release-assets/${{ github.ref_name }}
          path: release
          persist-credentials: false

      - name: Verify ZIP, checksum and launcher version
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, struct, zipfile
          tag = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'launcher-v(\d+\.\d+\.\d+)', tag)
          assert match, 'Unexpected release tag'
          version = match.group(1)
          source = pathlib.Path('LauncherUpdate.cs').read_text('utf-8')
          assert 'CurrentVersion="'+version+'"' in source, 'Source and release versions differ'
          root = pathlib.Path('release')
          archive = root/'Celesphonia-Delta-Launcher-CH1.zip'
          checksum = root/'Celesphonia-Delta-Launcher-CH1.zip.sha256.txt'
          assert archive.is_file() and checksum.is_file()
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert checksum.read_text('utf-8').strip() == digest+'  '+archive.name, 'Checksum mismatch'
          allowed = {'Celesphonia Portable Switcher.exe','EnglishRuntime.js','README.txt','mod-recipes.json','version-fingerprints.json'}
          versions = (
            'gorpg-1-23','maple-1-7-2','three-in-one-3-3-4',
            'three-in-one-3-3-5-trial','three-in-one-3-3-5-v1-01',
            'three-in-one-3-3-5-v1-02','three-in-one-3-3-5-v1-03',
            'three-in-one-3-3-5-v1-04','three-in-one-3-3-5-v1-051',
            'three-in-one-3-3-5-v1-052',
          )
          allowed.update('English/'+v+'/'+item for v in versions for item in ('manifest.json','dictionary.json','catalog.json'))
          with zipfile.ZipFile(archive) as bundle:
            assert bundle.testzip() is None, 'Corrupt ZIP entry'
            assert set(bundle.namelist()) == allowed, 'Unknown or missing ZIP entries'
            # Older launchers permit only these 35 entries. The five English
            # pictures are embedded inside the EXE, never separate ZIP files.
            assert len(allowed) == 35
            executable = bundle.read('Celesphonia Portable Switcher.exe')
            # Each native reference is a hash-only inventory, never game bytes.
            # Require exact release-catalog bytes inside the distributed EXE.
            native_refs = {
              'NativeReferenceFiles.json': ('gorpg-1-23', 7208),
              'NativeReferenceFiles-ch-current.json': ('ch-current', 13654),
              'NativeReferenceFiles-maple-1-7-2.json': ('maple-1-7-2', 9727),
              'NativeReferenceFiles-three-in-one-3-3-4.json': ('three-in-one-3-3-4', 9474),
            }
            for name, (ident, expected_count) in native_refs.items():
              content = pathlib.Path(name).read_bytes()
              native = json.loads(content)
              assert native['Format'] == 1 and native['VersionId'] == ident
              assert len(native['Files']) == expected_count
              assert len({f['Path'].casefold() for f in native['Files']}) == expected_count
              assert all(len(f['Hash']) == 64 and f['Size'] >= 0 for f in native['Files'])
              assert content in executable, 'EXE native inventory differs from source: ' + name
            runtime = bundle.read('EnglishRuntime.js')
            assert b'installGroperTicker' in runtime, 'Native Ticker groper rendering fix missing'
            assert b'installGlossaryPictureLayout' in runtime, 'Glossary illustration layout repair missing'
            assert b'installSeparateBedroomToggle' in runtime and b'toggle.locate(4,14)' in runtime, 'Separate bedroom interaction fix missing'
            assert b'Groper Level: Technician' in runtime, 'Native groper HUD captions missing'
            assert b'celesphonia-english/images/' in runtime, 'Help image redirection missing'
            assert b'English/ImageLocalization/manifest.json' in executable, 'Embedded localized artwork missing'
            artwork = json.loads(pathlib.Path('English/ImageLocalization/manifest.json').read_text('utf-8'))
            assert set(artwork['versionIds']) == {'three-in-one-3-3-5-v1-051','three-in-one-3-3-5-v1-052'}
            assert len(artwork['images']) == 5
            for name, info in artwork['images'].items():
              data = pathlib.Path('English/ImageLocalization',name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              assert list(struct.unpack('>II',data[16:24])) == [info['width'],info['height']]
              assert hashlib.sha256(data).hexdigest() == info['localizedSHA256']
              assert name.encode('utf-8') in executable, 'Executable omitted localized image: '+name
            changelog = bundle.read('README.txt').decode('utf-8')
            assert all(('v1.0'+str(n)) in changelog for n in range(1,5)), 'Game changelog missing historical releases'
            assert 'v1.051' in changelog and 'v1.052' in changelog, 'Missing recent creator changelogs'
            recipes = json.loads(bundle.read('mod-recipes.json'))['Recipes']
            new_recipe = next(x for x in recipes if x['Id']=='three-in-one-3-3-5-v1-051')
            assert new_recipe['UpgradeFrom']==['three-in-one-3-3-5-v1-04'], 'Wrong v1.051 forward upgrade'
            assert new_recipe['SaveGeneration']==1051 and len(new_recipe['Files'])==5163, 'Unverified v1.051 creator archive'
            assert new_recipe['ArchiveHash'].lower()=='feda86817320cd548a56fc17afa41cc8e345d93b3dae3d44f7535538c9a5d8ac'
            latest = next(x for x in recipes if x['Id']=='three-in-one-3-3-5-v1-052')
            assert latest['UpgradeFrom']==['three-in-one-3-3-5-v1-04','three-in-one-3-3-5-v1-051']
            assert latest['SaveGeneration']==1052 and len(latest['Files'])==5163 and latest['ArchiveBytes']==547645049
            assert latest['ArchiveHash'].lower()=='5dc382a21ed8db8d5597dbabefa6b82ff243937b51199f5b66e45b4854b7e1a2'
            assert set(latest['Files'])==set(new_recipe['Files'])
            assert [key for key in latest['Files'] if latest['Files'][key]!=new_recipe['Files'][key]]==['data/Enemies.json']
            assert latest['Fingerprints']['data/Enemies.json']!=new_recipe['Fingerprints']['data/Enemies.json']
            assert len(latest['Fingerprints'])==len(new_recipe['Fingerprints'])==6
            fingerprints = json.loads(bundle.read('version-fingerprints.json'))['Versions']
            new_fingerprint = next(x for x in fingerprints if x['Id']=='three-in-one-3-3-5-v1-051')
            assert new_fingerprint['Fingerprints']==new_recipe['Fingerprints'], 'v1.051 native detection mismatch'
            latest_fingerprint = next(x for x in fingerprints if x['Id']=='three-in-one-3-3-5-v1-052')
            assert latest_fingerprint['Fingerprints']==latest['Fingerprints'], 'v1.052 native detection mismatch'
            assert 'kitomisaitichi-design/celesphonia-launcher' in source, 'Official update source not embedded'
            translation = json.loads(bundle.read('English/three-in-one-3-3-5-v1-04/dictionary.json'))
            catalog = json.loads(bundle.read('English/three-in-one-3-3-5-v1-04/catalog.json'))
            aliases = [k for k, row in catalog.items() if 'legacy-runtime-display' in row.get('kinds', [])]
            assert len(aliases) == 472 and all(k in translation for k in aliases), 'Missing verified legacy v1.04 runtime displays'
            title = [k for k in translation if k.startswith('魔法少女苍蓝星★三合一改')]
            assert len(title)==3 and all(not re.search(r'[\u3400-\u9fff]',translation[k]) for k in title), 'Untranslated v1.04 titles'
            assert len(translation) >= 34957, 'v1.04 runtime display preservation regressed'
            for source, target in {
                '敵全体': 'All Enemies',
                '装備不可': 'Cannot Equip',
                '口腔侵蚀度': 'Oral Corruption',
            }.items():
                assert translation.get(source)==target, 'Missing legacy display: '+source
            new_manifest = json.loads(bundle.read('English/three-in-one-3-3-5-v1-051/manifest.json'))
            new_dictionary = json.loads(bundle.read('English/three-in-one-3-3-5-v1-051/dictionary.json'))
            new_catalog = json.loads(bundle.read('English/three-in-one-3-3-5-v1-051/catalog.json'))
            assert len(new_dictionary) >= 34996, 'Ver1.051 translation coverage regressed'
            assert len(new_dictionary)==new_manifest['TranslatedTexts'] and len(new_catalog)==new_manifest['TotalTexts']
            assert new_manifest['Fingerprints']==new_recipe['Fingerprints']
            assert hashlib.sha256(bundle.read('English/three-in-one-3-3-5-v1-051/dictionary.json')).hexdigest()==new_manifest['DictionaryHash']
            assert hashlib.sha256(bundle.read('English/three-in-one-3-3-5-v1-051/catalog.json')).hexdigest()==new_manifest['CatalogHash']
            assert new_dictionary.get('污浊宝珠')=='Tainted Orb', 'Missing new crafting item translation'
            assert new_dictionary.get('不知廉耻')=='Shamelessness', 'Missing new concept translation'
            choice_aliases = json.loads(pathlib.Path('English/v1051-rendered-choice-aliases.json').read_text('utf-8'))['derived_aliases']
            assert len(choice_aliases)==6
            assert all(new_dictionary.get(k)==v for k,v in choice_aliases.items()), 'Native MPP_ChoiceEX menu label translation regressed'
            engam = json.loads(pathlib.Path('English/v1051-engram-overrides.json').read_text('utf-8'))
            assert len(engam)==9 and all(new_dictionary.get(k)==v for k,v in engam.items()), 'Creator Skill Engram line descriptions regressed'
            latest_manifest = json.loads(bundle.read('English/three-in-one-3-3-5-v1-052/manifest.json'))
            latest_dictionary = json.loads(bundle.read('English/three-in-one-3-3-5-v1-052/dictionary.json'))
            latest_catalog = json.loads(bundle.read('English/three-in-one-3-3-5-v1-052/catalog.json'))
            assert latest_manifest['Fingerprints']==latest['Fingerprints']
            assert latest_manifest['DictionaryHash']==hashlib.sha256(bundle.read('English/three-in-one-3-3-5-v1-052/dictionary.json')).hexdigest()
            assert latest_manifest['CatalogHash']==hashlib.sha256(bundle.read('English/three-in-one-3-3-5-v1-052/catalog.json')).hexdigest()
            assert len(latest_dictionary)==latest_manifest['TranslatedTexts']==34996
            assert len(latest_catalog)==latest_manifest['TotalTexts']
            assert all(latest_dictionary.get(k)==v for k,v in new_dictionary.items()), 'Ver1.052 lost an existing Ver1.051 translation'
            assert all(latest_dictionary.get(k)==v for k,v in engam.items()), 'Ver1.052 Engram regression'
            assert all(latest_dictionary.get(k)==v for k,v in choice_aliases.items()), 'Ver1.052 guard choice regression'
          print('VERIFIED',tag,'files',len(allowed),'bytes',archive.stat().st_size,'sha256',digest)
          PY

      - name: Publish release only after asset verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/Celesphonia-Delta-Launcher-CH1.zip" \
            "release/Celesphonia-Delta-Launcher-CH1.zip.sha256.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Celesphonia Launcher $GITHUB_REF_NAME" \
            --notes-file "release/RELEASE-NOTES.md" \
            --latest
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets --jq '{draft:.isDraft,prerelease:.isPrerelease,assets:[.assets[].name]}'
